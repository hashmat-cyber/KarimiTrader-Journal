<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - KarimiTrader.Journal</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">
<div class="auth-box">
        <a href="/" class="auth-logo">KarimiTrader<span>-Journal</span></a>

        <h1>Create Account</h1>
        <p class="auth-subtitle">Start keeping your trading journal.</p>

        <form id="registerForm">
            <label>Username</label>
            <input type="text" id="username" required placeholder="Your username">

            <label>Email</label>
            <input type="email" id="email" required placeholder="you@example.com">

            <label>Password</label>
            <input type="password" id="password" required placeholder="At least 6 characters">

            <label>Confirm Password</label>
            <input type="password" id="confirmPassword" required placeholder="Repeat password">

            <button type="submit" class="btn full-width">Create Account</button>
        </form>

        <div id="message" class="message"></div>

        <p class="auth-footer">
            <span>Already have an account?</span>
            <a href="/login.html">Login</a>
        </p>
    </div>

        <script src="/app.js"></script>
</body>
</html>
