<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KarimiTrader.Journal</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth-page">

    <div class="auth-box">
        <a href="/" class="auth-logo">KarimiTrader<span>-Journal</span></a>

        <h1>Welcome Back</h1>
        <p class="auth-subtitle">Login to your trading journal.</p>

        <form id="loginForm">
            <label>Email</label>
            <input type="email" id="email" required placeholder="you@example.com">

            <label>Password</label>
            <input type="password" id="password" required placeholder="Your password">

            <button type="submit" class="btn full-width">Login</button>
        </form>

        <div id="message" class="message"></div>

        <p class="auth-footer">
            Don't have an account?
            <a href="/register.html">Create one</a>
        </p>
    </div>

    <script src="/app.js"></script>
</body>
</html>
