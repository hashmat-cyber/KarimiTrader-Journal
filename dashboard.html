<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - KarimiTrader.Journal</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>

    <header class="dashboard-header">
        <a href="/dashboard.html" class="brand">
    <img src="/logo.png" alt="Karimi Trader Logo" class="brand-logo">
    <span>KarimiTrader<span>-Journal</span></span>
</a>

        <nav>
            <a href="/dashboard.html" class="active">Dashboard</a>
            <a href="/new-trade.html">New Trade</a>
            <a href="/trades.html">Journal</a>
            <button id="logoutBtn" class="logout-btn">Logout</button>
        </nav>
    </header>

    <main class="container">

        <div class="page-heading">
            <div>
                <p class="eyebrow">YOUR JOURNAL</p>
                <h1>Dashboard</h1>
                <p id="welcomeText">Welcome back.</p>
            </div>

            <a href="/new-trade.html" class="btn">+ New Trade</a>
        </div>

        <section class="stats-grid">

            <div class="stat-card">
                <span>Total Trades</span>
                <strong id="totalTrades">0</strong>
            </div>

            <div class="stat-card">
                <span>Wins</span>
                <strong id="wins">0</strong>
            </div>

            <div class="stat-card">
                <span>Losses</span>
                <strong id="losses">0</strong>
            </div>

            <div class="stat-card">
                <span>Win Rate</span>
                <strong id="winRate">0%</strong>
            </div>

            <div class="stat-card">
                <span>Total P/L</span>
                <strong id="totalProfit">$0.00</strong>
            </div>

        </section>

        <section class="dashboard-section">
            <div class="section-heading">
                <h2>Recent Trades</h2>
                <a href="/trades.html">View all</a>
            </div>

            <div id="recentTrades" class="trade-list">
                <div class="empty-state">
                    No trades recorded yet.
                </div>
            </div>
        </section>

    </main>

    <script src="/app.js"></script>
</body>
</html>
